services:
  db:
    image: mysql:8.0
    container_name: framevault-db-prod
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --performance-schema=OFF --innodb-buffer-pool-size=64M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password_99}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-framevault}
      MYSQL_USER: ${MYSQL_USER:-framevault}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-framevault_secure_password_99}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=$${MYSQL_ROOT_PASSWORD:-root_secure_password_99} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${ECR_REGISTRY:-framevault}/backend:${IMAGE_TAG:-latest}
    container_name: framevault-backend-prod
    restart: always
    environment:
      APP_ENV: production
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-framevault}:${MYSQL_PASSWORD:-framevault_secure_password_99}@db:3306/${MYSQL_DATABASE:-framevault}
      JWT_SECRET: ${JWT_SECRET:-framevault-super-secure-production-jwt-token-key-replace}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-framevault-assets-prod-2026}
      ALLOWED_ORIGINS: ${DOMAIN_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${ECR_REGISTRY:-framevault}/frontend:${IMAGE_TAG:-latest}
    container_name: framevault-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  mysql_prod_data:

name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/framevault.pem
          chmod 600 ~/.ssh/framevault.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/framevault.pem "$EC2_USER@$EC2_HOST" <<'REMOTE'
            set -e
            cd ~/paradise
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
            docker image prune -f

            wait_for_url() {
              url="$1"
              attempts=30
              until curl --fail --silent --show-error "$url" >/dev/null; do
                attempts=$((attempts - 1))
                if [ "$attempts" -eq 0 ]; then
                  echo "Health check failed: $url"
                  docker compose ps
                  docker compose logs --tail=80 backend frontend
                  exit 1
                fi
                sleep 2
              done
            }

            wait_for_url http://localhost:8000/health
            wait_for_url http://localhost:3000/health
            wait_for_url http://localhost/health
            docker compose ps
          REMOTE
